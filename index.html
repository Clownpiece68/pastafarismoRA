<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

    <!-- CSS -->
    <style>
        .hidden {
            visibility: hidden;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <!-- HOME SCREEN -->
    <section id="home" class="screen">
        <button id="start" onclick="startAR()">Start</button>
    </section>


    <!-- FILTER VIEWER -->
    <section id="filters" class="screen hidden">

        <!-- MINDAR SCENE -->
        <a-scene
            mindar-face="autoStart: false"
            embedded
            color-space="sRGB"
            renderer="colorManagement: true, physicallyCorrectLights"
            vr-mode-ui="enabled: false"
            device-orientation-permission-ui="enabled: false">

            <!-- CAMERA -->
            <a-camera active="false" position="0 0 0"></a-camera>

            <!-- FACE TRACKING -->
            <a-entity mindar-face-target="anchorIndex: 1">

                <!-- CURRENT MODEL -->
                <a-entity
                    id="model"
                    gltf-model="./plastico.glb">
                </a-entity>

            </a-entity>

        </a-scene>


        <!-- FILTER CONTROLS -->
        <div class="filter-controls">

            <button id="previous-filter" onclick="previousModel()">
                Previous
            </button>

            <button id="next-filter" onclick="nextModel()">
                Next
            </button>

            <button id="take-photo" onclick="showScreen('preview')">
                Take picture
            </button>

        </div>

    </section>


    <!-- PHOTO PREVIEW -->
    <section id="preview" class="screen hidden">

        <img id="photo-preview" alt="Photo preview">

        <button id="save-photo">
            Save
        </button>

        <button id="discard-photo" onclick="showScreen('filters')">
            Return
        </button>

    </section>


    <!-- JAVASCRIPT -->
    <script>

        // REFERENCES

        const scene = document.querySelector("a-scene");
        const model = document.querySelector("#model");


        // AVAILABLE MODELS

        const models = [
            "plastico",
            "dobleasa",
            "unaasa"
        ];

        let currentModel = 0;
        let arStarted = false;


        // NAVIGATION

        function showScreen(screenId) {

            document.querySelectorAll(".screen").forEach(screen => {
                screen.classList.add("hidden");
            });

            document.getElementById(screenId).classList.remove("hidden");

        }


        // INITIALIZE AR

        function startAR() {

            showScreen("filters");

            if (arStarted) return;

            const arSystem = scene.systems["mindar-face-system"];

            arSystem.start();

            arStarted = true;

        }


        // CHANGE MODEL

        function changeModel(modelId) {

            if (!model) {
                console.error("Model entity not found!");
                return;
            }

            console.log("Loading model:", modelId);

            model.setAttribute(
                "gltf-model",
                `./${modelId}.glb`
            );

        }


        // NEXT MODEL

        function nextModel() {

            currentModel++;

            if (currentModel >= models.length) {
                currentModel = 0;
            }

            changeModel(models[currentModel]);

        }


        // PREVIOUS MODEL

        function previousModel() {

            currentModel--;

            if (currentModel < 0) {
                currentModel = models.length - 1;
            }

            changeModel(models[currentModel]);

        }


        // MODEL LOADING EVENTS

        model.addEventListener("model-loaded", () => {

            console.log("Model successfully loaded!");

        });


        model.addEventListener("model-error", (event) => {

            console.error("Model loading error:", event.detail);

        });


    </script>

</body>
</html>
