
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pastafarismo</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

    <!-- CSSSHIT -->
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .screen {
            width: 100%;
            height: 100vh;
        }

        .hidden {
            visibility: hidden;
            pointer-events: none;
        }

        #home, #preview {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .filter-controls {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 10px;
            z-index: 10;
        }

        button {
            padding: 12px 18px;
            cursor: pointer;
        }

        #photo-preview {
            max-width: 90%;
            max-height: 70%;
        }
    </style>
</head>

<body>

    <!-- PANTALLA INICIO -->
    <section id="home" class="screen">
        <h1>Pastafarismo</h1>
        <img src="./placeholder.png" width="70" height="70"></img>
        <button id="start" onclick="startAR()">Start</button>
    </section>


    <!-- PANTALLA DE FILTROS -->
    <section id="filters" class="screen hidden">

        <a-scene
            mindar-face="autoStart: false"
            embedded
            color-space="sRGB"
            renderer="colorManagement: true, physicallyCorrectLights"
            vr-mode-ui="enabled: false"
            device-orientation-permission-ui="enabled: false">

            <a-camera
                active="false"
                position="0 0 0">
            </a-camera>

            <a-entity mindar-face-target="anchorIndex: 1">
                <!-- Modelos -->
                <a-entity
                    id="model"
                    gltf-model="./plastico.glb"
                    position="0 0 0"
                    rotation="0 0 0"
                    scale="1 1 1">
                </a-entity>
            </a-entity>
        </a-scene>


        <!-- Controles -->
        <div class="filter-controls">
            <button onclick="previousModel()">Previous</button>
            <button onclick="nextModel()">Next</button>
            <button onclick="showScreen('preview')">Take picture</button>
        </div>

    </section>


    <!-- PANTALLA DE FOTO -->
    <section id="preview" class="screen hidden">
        <h2>Guardar?</h2>
        <img id="photo-preview">
        <button id="save-photo">Save</button>
        <button onclick="showScreen('filters')">Return</button>
    </section>

    <!-- JAVASHIT -->
    <script>
        const scene = document.querySelector("a-scene");
        const model = document.querySelector("#model");
        const models = ["plastico", "dobleasa","unaasa"];
        let currentModel = 0;
        let arStarted = false;

        // Navegacion
        function showScreen(screenId) {
            document.querySelectorAll(".screen").forEach(screen => {
                screen.classList.add("hidden");
            });
            document.getElementById(screenId).classList.remove("hidden");
        }

        // Inicializa el AR
        function startAR() {
            showScreen("filters");
            const arSystem = scene.systems["mindar-face-system"];
            arSystem.start();
        }

        // Cambiar entre modelos

        function changeModel(modelId) {
            model.setAttribute("gltf-model",`./${modelId}.glb`);
        }
        function nextModel() {
            currentModel++;
            if (currentModel >= models.length) {
                currentModel = 0;
            }
            changeModel(models[currentModel]);
        }
        function previousModel() {
            currentModel--;
            if (currentModel < 0) {
                currentModel = models.length - 1;
            }
            changeModel(models[currentModel]);
        }
    </script>

</body>
</html>
