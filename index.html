
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pastafarismo RA</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .screen {
            width: 100%;
            height: 100vh;
        }

        .hidden {
            visibility: hidden;
            pointer-events: none;
        }

        #home, #preview {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #filters {
            position: relative;
        }

        a-scene {
            width: 100%;
            height: 100%;
        }

        .filter-controls {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 10px;
            z-index: 10;
        }

        button {
            padding: 12px 18px;
            cursor: pointer;
        }

        #photo-preview {
            max-width: 90%;
            max-height: 70%;
        }
    </style>
</head>

<body>

    <!-- HOME SCREEN -->
    <section id="home" class="screen">
        <h1>Pastafarismo RA</h1>
        <p>Put a pasta strainer on your head!</p>
        <button id="start" onclick="startAR()">Start</button>
    </section>


    <!-- AR FILTER SCREEN -->
    <section id="filters" class="screen hidden">

        <a-scene
            mindar-face="autoStart: false"
            embedded
            color-space="sRGB"
            renderer="colorManagement: true, physicallyCorrectLights"
            vr-mode-ui="enabled: false"
            device-orientation-permission-ui="enabled: false">

            <a-camera
                active="false"
                position="0 0 0">
            </a-camera>

            <!-- FACE TRACKING ANCHOR -->
            <a-entity mindar-face-target="anchorIndex: 1">

                <!-- TEST BOX: SHOULD APPEAR ON YOUR FACE -->
                <a-box
                    color="red"
                    position="0 0 0"
                    scale="0.1 0.1 0.1">
                </a-box>

                <!-- 3D MODEL -->
                <a-entity
                    id="model"
                    gltf-model="./plastico.glb"
                    position="0 0 0"
                    rotation="0 0 0"
                    scale="0.1 0.1 0.1">
                </a-entity>

            </a-entity>

        </a-scene>


        <!-- FILTER CONTROLS -->
        <div class="filter-controls">
            <button onclick="previousModel()">Previous</button>
            <button onclick="nextModel()">Next</button>
            <button onclick="showScreen('preview')">Take picture</button>
        </div>

    </section>


    <!-- PHOTO PREVIEW SCREEN -->
    <section id="preview" class="screen hidden">
        <h2>Your picture</h2>

        <img id="photo-preview" alt="Captured photo">

        <button id="save-photo">Save</button>
        <button onclick="showScreen('filters')">Return</button>
    </section>


    <script>

        // --------------------------------
        // REFERENCES
        // --------------------------------

        const scene = document.querySelector("a-scene");
        const model = document.querySelector("#model");

        const models = [
            "plastico",
            "dobleasa",
            "unaasa"
        ];

        let currentModel = 0;
        let arStarted = false;


        // --------------------------------
        // SCREEN NAVIGATION
        // --------------------------------

        function showScreen(screenId) {

            document.querySelectorAll(".screen").forEach(screen => {
                screen.classList.add("hidden");
            });

            document.getElementById(screenId).classList.remove("hidden");
        }


        // --------------------------------
        // START AR
        // --------------------------------

        async function startAR() {

            showScreen("filters");

            if (arStarted) return;

            const arSystem = scene.systems["mindar-face-system"];

            if (!arSystem) {
                console.error("MindAR system not found!");
                return;
            }

            try {
                await arSystem.start();
                arStarted = true;
                console.log("AR started successfully!");
            } catch (error) {
                console.error("Could not start AR:", error);
            }
        }


        // --------------------------------
        // MODEL SWITCHING
        // --------------------------------

        function changeModel(modelId) {

            if (!model) {
                console.error("Model entity not found!");
                return;
            }

            console.log("Loading model:", modelId);

            model.setAttribute(
                "gltf-model",
                `./${modelId}.glb`
            );
        }


        function nextModel() {

            currentModel++;

            if (currentModel >= models.length) {
                currentModel = 0;
            }

            changeModel(models[currentModel]);
        }


        function previousModel() {

            currentModel--;

            if (currentModel < 0) {
                currentModel = models.length - 1;
            }

            changeModel(models[currentModel]);
        }


        // --------------------------------
        // MODEL LOADING EVENTS
        // --------------------------------

        model.addEventListener("model-loaded", () => {
            console.log("Model successfully loaded!");
        });


        model.addEventListener("model-error", (event) => {
            console.error("Model loading error:", event.detail);
        });


        // --------------------------------
        // INITIALIZATION
        // --------------------------------

        console.log("Pastafarismo RA initialized!");

    </script>

</body>
</html>
