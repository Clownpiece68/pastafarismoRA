
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pastafarismo</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

    <!-- CSSSHIT -->
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .screen {
            width: 100%;
            height: 100vh;
        }

        .hidden {
            visibility: hidden;
            pointer-events: none;
        }

        #home, #preview {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .filter-controls {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 10px;
            z-index: 10;
        }

        button {
            padding: 12px 18px;
            cursor: pointer;
        }

        #photo-preview {
            max-width: 90%;
            max-height: 70%;
        }

        #filters {
            position: relative;
        }


    </style>
</head>

<body>

    <!-- PANTALLA INICIO -->
    <section id="home" class="screen">
        <h1>Pastafarismo</h1>
        <img src="./placeholder.png" width="70" height="70"></img>
        <button id="start" onclick="startAR()">Start</button>
    </section>


    <!-- PANTALLA DE FILTROS -->
    <section id="filters" class="screen hidden">

        <a-scene
            mindar-face="autoStart: false"
            embedded
            color-space="sRGB"
            renderer="colorManagement: true, physicallyCorrectLights: true, preserveDrawingBuffer: true"
            vr-mode-ui="enabled: false"
            device-orientation-permission-ui="enabled: false">

            <a-camera
                active="false"
                position="0 0 0">
            </a-camera>

            <a-entity mindar-face-target="anchorIndex: 1">
                <!-- Modelos -->
                <a-entity
                    id="model"
                    gltf-model="./plastico.glb"
                    position="0 0 0"
                    rotation="0 0 0"
                    scale="1 1 1">
                </a-entity>
            </a-entity>
        </a-scene>


        <!-- Controles -->
        <div class="filter-controls">
            <button onclick="previousModel()">Previous</button>
            <button onclick="nextModel()">Next</button>
            <button onclick="capturePhoto()">Take picture</button>
        </div>

    </section>


    <!-- PANTALLA DE FOTO -->
    <section id="preview" class="screen hidden">
        <h2>Guardar?</h2>
        <img id="photo-preview">
        <button id="save-photo" onclick="savePhoto()">Save</button>
        <button onclick="showScreen('filters')">Return</button>
    </section>

    <!-- JAVASHIT -->
    <script>
        const scene = document.querySelector("a-scene");
        const model = document.querySelector("#model");
        const models = ["plastico", "dobleasa","unaasa"];
        const previewImage = document.querySelector("#photo-preview");
        let currentModel = 0;
        let arStarted = false;
        let photoURL = null;

        // Navegacion
        function showScreen(screenId) {
            document.querySelectorAll(".screen").forEach(screen => {
                screen.classList.add("hidden");
            });
            document.getElementById(screenId).classList.remove("hidden");
        }

        // Inicializa el AR
        function startAR() {
            showScreen("filters");
            const arSystem = scene.systems["mindar-face-system"];
            arSystem.start();
        }

        // Cambiar entre modelos
        function changeModel(modelId) {
            model.setAttribute("gltf-model",`./${modelId}.glb`);
        }
        function nextModel() {
            currentModel++;
            if (currentModel >= models.length) {
                currentModel = 0;
            }
            changeModel(models[currentModel]);
        }
        function previousModel() {
            currentModel--;
            if (currentModel < 0) {
                currentModel = models.length - 1;
            }
            changeModel(models[currentModel]);
        }

        // Tomar foto
        async function capturePhoto() {

    console.log("Taking picture...");

    const video = document.querySelector("video");

    // Get the actual WebGL canvas used by A-Frame
    const arCanvas = scene.renderer?.domElement;

    if (!video || !arCanvas) {
        console.error("Camera video or AR renderer canvas not found!");
        return;
    }

    if (video.readyState < 2) {
        console.error("Camera is not ready yet!");
        return;
    }

    // Wait for the next animation frame
    await new Promise(resolve => requestAnimationFrame(resolve));

    // Create the final photograph canvas
    const photoCanvas = document.createElement("canvas");

    const width = video.videoWidth;
    const height = video.videoHeight;

    photoCanvas.width = width;
    photoCanvas.height = height;

    const context = photoCanvas.getContext("2d");

    // Draw camera
    context.drawImage(video, 0, 0, width, height);

    // Draw the actual A-Frame rendering over the camera
    context.drawImage(arCanvas, 0, 0, width, height);

    // Generate image
    photoCanvas.toBlob((blob) => {

        if (!blob) {
            console.error("Could not create photo!");
            return;
        }

        // Replace previous photo
        if (photoURL) {
            URL.revokeObjectURL(photoURL);
        }

        photoURL = URL.createObjectURL(blob);

        previewImage.src = photoURL;

        showScreen("preview");

        console.log("Picture captured successfully!");

    }, "image/png");
}

        // Guardar la foto
         function savePhoto() {
            if (!photoURL) {
                console.error("No hay foto pa");
                return;
            }
            const link = document.createElement("a");
            link.href = photoURL;
            link.download = "pastafarismo.png";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
        
    </script>

</body>
</html>
