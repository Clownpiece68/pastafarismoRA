<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

      <!-- CSSSHIT -->
	  <style>
        .hidden {
			visibility: hidden;
			pointer-events: none;
		}

       </style>
  </head>
  <body>
	  <!-- SECCIONES DE LA PAGINA -->

	  <!-- ||SECCION DE INICIO|| -->
	<section id="home" class="screen">
		<button id="start" onclick="startAR()">Start</button>
    </section>


	  <!-- ||SECCION DE FILTROS|| -->
    <section id="filters" class="screen hidden">

    <!-- Armado de MindAR -->
        <a-scene
          mindar-face="autoStart: false"
          embedded
          color-space="sRGB"
          renderer="colorManagement: true, physicallyCorrectLights"
          vr-mode-ui="enabled: false"
          device-orientation-permission-ui="enabled: false">

            <a-camera active="false" position="0 0 0"></a-camera>

			 <a-assets>
                <a-asset-item id="plastico"
                    src="./plastico.glb"></a-asset-item>
                <a-asset-item id="dobleasa"
                    src="./dobleasa.glb"></a-asset-item>
                <a-asset-item id="unaasa"
                    src="./unaasa.glb"></a-asset-item>
            </a-assets>

            <a-entity mindar-face-target="anchorIndex: 1">
				<a-entity
					id="model"
					gltf-model="#plastico">
				</a-entity>
			</a-entity>

        </a-scene>

    <!-- controles -->
        <div class="filter-controls">
            <button id="previous-filter" onclick="previousModel()">Previous</button>
            <button id="next-filter" onclick="nextModel()">Next</button>
            <button id="take-photo" onclick="showScreen('preview')">Take picture</button>
        </div>
    </section>

	<!-- ||SECCION DE FOTO|| -->
    <section id="preview" class="screen hidden">
        <img id="photo-preview">
        <button id="save-photo">Save</button>
        <button id="discard-photo" onclick="showScreen('filters')">Return</button>
    </section>

<!-- JAVASHIT -->
	 
    <script>
		const scene = document.querySelector("a-scene");
		const model = document.querySelector("#model");
		const models = ["plastico","dobleasa","unaasa"];
		let currentModel = 0;
		
		// Funcion para cambiar de secciones
		function showScreen(screenId) {
            document.querySelectorAll(".screen").forEach(screen => {
              screen.classList.add("hidden");
	        });
            document.getElementById(screenId).classList.remove("hidden");
        }

		// Funcion para inicializar el AR
        function startAR() {
            showScreen("filters");
            const arSystem = scene.systems["mindar-face-system"];
            arSystem.start();
        }

		// Funcionnes para cambiar modelos 
		function changeModel(modelId) {
			model.setAttribute("gltf-model", `#${modelId}`);
		}
		function nextModel() {
			currentModel++;
			if (currentModel >= models.length) {
				currentModel = 0;
			}
			changeModel(models[currentModel]);
		}
		function previousModel() {
			currentModel--;
			if (currentModel < 0) {
				currentModel = models.length - 1;
			}
			changeModel(models[currentModel]);
		}
	</script>

	  
  </body>
</html>
